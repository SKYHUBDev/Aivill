<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <!-- Eye gradient - menacing red -->
    <linearGradient id="eye" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="50%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#e94560"/>
    </linearGradient>
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" rx="60" fill="url(#bg)"/>
  
  <!-- Outer eye ring -->
  <ellipse cx="200" cy="180" rx="140" ry="90" fill="none" stroke="url(#eye)" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Inner eye ring -->
  <ellipse cx="200" cy="180" rx="100" ry="60" fill="none" stroke="url(#eye)" stroke-width="6" opacity="0.7"/>
  
  <!-- Pupil - menacing slit -->
  <ellipse cx="200" cy="180" rx="45" ry="35" fill="#0a0a14"/>
  
  <!-- Cat-eye pupil highlight -->
  <ellipse cx="200" cy="180" rx="20" ry="25" fill="#1a1a2e"/>
  
  <!-- Main glint -->
  <circle cx="220" cy="165" r="12" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Secondary glint -->
  <circle cx="180" cy="195" r="5" fill="#ffffff" opacity="0.6"/>
  
  <!-- Text: AiVill -->
  <text x="200" y="300" text-anchor="middle" fill="#e94560" font-family="Arial Black, Impact, sans-serif" font-size="52" font-weight="bold" filter="url(#glow)">AiVill</text>
  
  <!-- Subtitle -->
  <text x="200" y="335" text-anchor="middle" fill="#8892b0" font-family="Arial, sans-serif" font-size="16">Adaptive AI Villains</text>
  
  <!-- Decorative corner accents -->
  <path d="M 40 40 L 80 40 L 80 50 L 50 50 L 50 80 L 40 80 Z" fill="#e94560" opacity="0.5"/>
  <path d="M 360 40 L 320 40 L 320 50 L 350 50 L 350 80 L 360 80 Z" fill="#e94560" opacity="0.5"/>
  <path d="M 40 360 L 80 360 L 80 350 L 50 350 L 50 320 L 40 320 Z" fill="#e94560" opacity="0.5"/>
  <path d="M 360 360 L 320 360 L 320 350 L 350 350 L 350 320 L 360 320 Z" fill="#e94560" opacity="0.5"/>
</svg>